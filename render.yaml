services:
  - type: web
    name: invoice-action-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: A2A_BEARER_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
